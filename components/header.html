<header class="header">
  <form class="searchbar" role="search" onsubmit="return false">
    <img src="assets/icons/header-buscar.svg" alt="" width="19" height="19">
    <label class="sr-only" for="busqueda-global">Búsqueda global</label>
    <input id="busqueda-global" class="searchbar__input" type="search" placeholder="Buscar productos, marcas, tendencias..." autocomplete="off">
  </form>

  <div class="header__actions">
    <button class="header__bell tap" type="button" aria-label="Notificaciones">
      <img src="assets/icons/header-campana.svg" alt="" width="20" height="20">
      <span class="header__bell-dot" aria-hidden="true"></span>
    </button>
    <button class="header__account tap" type="button" aria-label="Cuenta de Felipe" aria-haspopup="menu">
      <span class="header__avatar" aria-hidden="true">FP</span>
    </button>
    <img class="header__chevron" src="assets/icons/header-chevron.svg" alt="" width="17" height="17">
  </div>
</header>
